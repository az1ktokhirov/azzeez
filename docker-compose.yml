services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: groceryos
      POSTGRES_USER: posuser
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U posuser"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://posuser:${DB_PASSWORD}@db:5432/groceryos
      JWT_SECRET: ${JWT_SECRET}
      SUPER_JWT_SECRET: ${SUPER_JWT_SECRET}
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    command: sh -c "npx prisma migrate deploy && node src/server.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
